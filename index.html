<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vertical Log v0.1</title><style>body{margin:0;background:#faf7f4;color:#302d2d;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:480px;margin:auto;padding:18px}h1{font-size:25px;margin:10px 0 4px}.sub{color:#777;font-size:13px}video{width:100%;aspect-ratio:9/16;max-height:58vh;object-fit:cover;background:#222;border-radius:16px}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 18px;background:#35313a;color:white}button:disabled{opacity:.4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{flex:1}select,input{padding:10px;border-radius:9px;border:1px solid #ddd;background:white}.clip{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ddd}.clip video{width:70px;height:100px;border-radius:8px}.clip .meta{flex:1;min-width:0}.clip small{color:#666}dialog{border:0;border-radius:18px;padding:20px;width:min(85vw,380px)}dialog::backdrop{background:#0008}dialog input{width:90%}#status{min-height:22px;color:#795b60} .note{font-size:12px;color:#777;line-height:1.5}</style></head><body><main><h1>Vertical Log <small style="font-size:12px">v0.1</small></h1><div class="sub">1タップ撮影 → ひとこと → 端末内に保存</div><p id="status"></p><video id="camera" autoplay muted playsinline></video><div class="controls"><label>撮影時間 <select id="seconds"><option value="0.5">0.5秒</option><option value="1" selected>1秒</option><option value="2">2秒</option><option value="3">3秒</option><option value="5">5秒</option></select></label><button id="flip">カメラ切替</button></div><div class="controls"><button id="shoot" disabled>● 撮影する</button></div><h3>保存済みクリップ <span id="count">0</span></h3><div id="clips"></div><p class="note">この試作版は撮影・コメント・途中保存の動作確認用です。動画の結合、文字の焼き込み、書き出しは未実装です。SafariのWebサイトデータを削除すると保存済みクリップが消える可能性があります。大切な記録の唯一の保存先にしないでください。</p></main><dialog id="commentDialog"><form method="dialog" id="commentForm"><h3>ひとことを記録</h3><p id="takenAt"></p><input id="comment" maxlength="80" placeholder="きょうのひとこと" autocomplete="off"><div class="controls"><button value="save" id="saveComment">保存して次へ</button></div></form></dialog><script>
const $=id=>document.getElementById(id);let stream=null, facing='environment',busy=false,db=null,pending=null,urls=[];
function status(s){$('status').textContent=s}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('vertical-log-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function transact(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('clips',mode),store=t.objectStore('clips');let result;const req=fn(store);req.onsuccess=()=>result=req.result;t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error)})}
async function cameraStart(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:720},height:{ideal:1280},aspectRatio:{ideal:9/16}}});$('camera').srcObject=stream;$('shoot').disabled=false;status('撮影できます')}catch(e){status('カメラを開けません：Safariのカメラ許可を確認してください。 '+e.message)}}
function supportedMime(){return ['video/mp4','video/webm;codecs=h264','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||''}
async function shoot(){if(busy||!stream)return;busy=true;$('shoot').disabled=true;$('flip').disabled=true;status('撮影中…');const start=new Date(),parts=[];try{const mime=supportedMime(),rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const finished=new Promise((resolve,reject)=>{rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onerror=e=>reject(e.error||new Error('録画エラー'));rec.onstop=resolve});rec.start();await new Promise(r=>setTimeout(r,Number($('seconds').value)*1000));rec.stop();await finished;const blob=new Blob(parts,{type:rec.mimeType||'video/mp4'});if(!blob.size)throw new Error('動画データが空です');pending={id:crypto.randomUUID(),blob,time:start.toISOString(),seconds:Number($('seconds').value),comment:''};$('takenAt').textContent='撮影時刻：'+start.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('comment').value='';$('commentDialog').showModal();status('コメントを入力してください')}catch(e){status('撮影エラー：'+e.message);busy=false;$('shoot').disabled=false;$('flip').disabled=false}}
$('commentForm').addEventListener('submit',async e=>{e.preventDefault();if(!pending)return;pending.comment=$('comment').value.trim();try{await transact('readwrite',s=>s.put(pending));pending=null;$('commentDialog').close();status('端末内に保存しました');await render()}catch(e){status('保存できません：'+e.message)}finally{busy=false;$('shoot').disabled=false;$('flip').disabled=false}});
async function render(){urls.forEach(URL.revokeObjectURL);urls=[];const all=await transact('readonly',s=>s.getAll());all.sort((a,b)=>a.time.localeCompare(b.time));$('count').textContent=all.length;$('clips').replaceChildren();for(const c of all){const row=document.createElement('div');row.className='clip';const v=document.createElement('video');const url=URL.createObjectURL(c.blob);urls.push(url);v.src=url;v.muted=true;v.playsInline=true;v.controls=true;const info=document.createElement('div');info.className='meta';const title=document.createElement('div');title.textContent=new Date(c.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' · '+c.seconds+'秒';const comment=document.createElement('small');comment.textContent=c.comment||'（コメントなし）';const del=document.createElement('button');del.textContent='削除';del.style='background:#9c7777;padding:8px;margin-top:8px';del.onclick=async()=>{if(!confirm('このクリップを削除しますか？'))return;await transact('readwrite',s=>s.delete(c.id));await render()};info.append(title,comment,document.createElement('br'),del);row.append(v,info);$('clips').append(row)}}
$('shoot').onclick=shoot;$('flip').onclick=async()=>{facing=facing==='environment'?'user':'environment';await cameraStart()};(async()=>{try{if(!window.isSecureContext)throw new Error('HTTPSで開いてください');if(!('MediaRecorder'in window))throw new Error('このSafariではMediaRecorderが利用できません');db=await openDb();await render();await cameraStart()}catch(e){status('起動できません：'+e.message)}})();
</script></body></html>
